theme:
  palettes:
    hybrid:
      dark: true
      background: "#1b1b1b"
      foreground: "#c5c8c6"
      # cursor: "#de935f"
      cursor: "#c5c8c6"
      cursor_text: "#1b1b1b"

      normal:
        black: "#373b41"
        red: "#cc6666"
        green: "#b5bd68"
        yellow: "#f0c674"
        blue: "#81a2be"
        magenta: "#b294bb"
        cyan: "#8abeb7"
        white: "#c5c8c6"

      bright:
        black: "#282a2e"
        red: "#a54242"
        green: "#8c9440"
        yellow: "#de935f"
        blue: "#5f819d"
        magenta: "#85678f"
        cyan: "#5e8d87"
        white: "#707880"

      search:
        match_bg: "#8c9440"
        match_fg: "#282a2e"
        focused_bg: "#cc6666"
        focused_fg: "#282a2e"

      ext:
        surface: "#151719"
        element: "#212326"
        selection: "#2b2e33"
        comment: "#373b41"
        subtle: "#8c8e8c"
        border: "#888a88"
        extra_white: "#b0b2b0"
        extra_yellow: "#f0c674"
        extra_blue: "#81a2be"

      diff:
        add_bg: "#3a4230"
        add_fg: "#b5bd68"
        delete_bg: "#4a2828"
        delete_fg: "#cc6666"
        change_bg: "#303a45"
        hunk_fg: "#81a2be"
        highlight_add_fg: "#d0dc90"
        highlight_remove_fg: "#e8a0a0"

      applications:
        firefox:
          secondary: "#212326"
          activetab: "#2b2e33"
          hover: "#252830"
          close_hover: "#cc6666"
          throbber_busy: "#373b41"
          throbber_progress: "#5f819d"

        mpv:
          osd_fg: "#eeeeee"
          osd_border: "#0C0C0C"
          background: "#070707"
          # uosc uses BBGGRR
          uosc_fg: "c5c8c6"
          uosc_bg: "151719"
          uosc_cached: "b5bd68"

        sioyek:
          # float RGB = int(hex_pair) / 255, e.g. #c5c8c6 -> 0xc5=197 -> 197/255=0.773
          background_color: [1.0, 1.0, 1.0]
          dark_mode_background_color: [0.114, 0.122, 0.129]
          status_bar_color: [0.114, 0.122, 0.129]
          status_bar_text_color: [0.773, 0.784, 0.776]
