# NOTE ON MOUSE KEYBINDS
# uosc force-binds mbtn_left, so this script registers Alt+MBTN_LEFT as a single
# `complex` binding handling both press and release. A separate release binding
# gets swallowed by uosc and leaves the selection stuck.
# If intercepted, bind explicitly in input.conf:
#  Alt+MBTN_LEFT  script-binding area-blur-select
#  Alt+MBTN_RIGHT script-binding area-blur-remove
#  Alt+WHEEL_UP   script-binding area-blur-stronger
#  Alt+WHEEL_DOWN script-binding area-blur-weaker

# 'shader': one generated GLSL pass on GPU
# 'ffmpeg': crop+blur+overlay on CPU
backend=shader

# 'blur' or 'pixelate'. Toggled at runtime with 'm'.
effect=blur

# Blur radius in pixels. Used by both backends. Adjusted at runtime with
# Alt+wheel up/down, or Alt+z / Alt+Shift+z.
radius=52

# ffmpeg backend only: 'boxblur' (fast) or 'gblur' (smoother, slower).
ffmpeg_blur=boxblur

# ffmpeg backend only: gaussian sigma, used when ffmpeg_blur=gblur.
sigma=8

# Mosaic block size in pixels. Adjusted at runtime with Alt+wheel or Alt+z / Alt+Shift+z
# while effect is 'pixelate'.
pixel_size=26

# Blur radius step for wheel/key adjustments.
radius_step=10

# Maximum number of areas kept at once.
max_areas=24

# Areas thinner than this (fraction of frame) are discarded.
min_size=0.004

# Draw selection outline and corner handles.
outline=yes
handles=no

# Hide borders when not dragging (only show during drag). Toggled with Alt+b.
hide_borders_when_inactive=no

# Show debug OSD messages (area add/move/resize/remove, restore, effect toggle).
debug=no

# Persist blur areas per file to disk. Saved to
# <mpv-config>/area_blur_persist.json and restored on file open.
persist=yes
